# Local full-stack dev / production bundle. For Railway, individual services are
# split (see railway.json). This compose file runs the platform + worker together
# for convenience and single-service deployments.
services:
  codevia-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: codevia-platform:latest
    container_name: codevia-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/codevia.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Model providers (Secret References — never commit real keys)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_INSECURE: ${TELEGRAM_WEBHOOK_INSECURE:-false}
      TELEGRAM_WEBHOOK_ALLOW_LOOPBACK: ${TELEGRAM_WEBHOOK_ALLOW_LOOPBACK:-false}
      # auto = webhook when a public HTTPS URL exists, long polling otherwise.
      # Pin to "polling" for a private/behind-NAT deployment.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-auto}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-25}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      # Read-only local repository mirror (bare clones under REPO_MIRROR_DIR,
      # read with git plumbing only — repository code is never executed).
      REPO_MIRROR_ENABLED: ${REPO_MIRROR_ENABLED:-true}
      REPO_MIRROR_DIR: ${REPO_MIRROR_DIR:-/app/data/mirrors}
      REPO_MIRROR_REFRESH_MS: ${REPO_MIRROR_REFRESH_MS:-300000}
      # Imported / newly created local Git projects (inside the volume).
      LOCAL_REPOS_DIR: ${LOCAL_REPOS_DIR:-/app/data/repos}
      # Docker sandbox: local/imported project commands run in a disposable
      # container. This needs the docker CLI in the image
      # (`docker build --build-arg INSTALL_DOCKER_CLI=true .`) and a reachable
      # daemon (see the socket option below or DOCKER_HOST for a sidecar).
      # GitHub-backed projects verify through CI and need none of this.
      PROJECT_SANDBOX_ENABLED: ${PROJECT_SANDBOX_ENABLED:-true}
      PROJECT_SANDBOX_IMAGE: ${PROJECT_SANDBOX_IMAGE:-}
      # never | missing | always — explicit `docker image inspect`/`pull` step
      # before `docker run` (the run itself always keeps --pull=never).
      PROJECT_SANDBOX_IMAGE_PULL: ${PROJECT_SANDBOX_IMAGE_PULL:-never}
      # 7z reads uploaded .rar archives; installed by the Dockerfile.
      PROJECT_IMPORT_7Z_BIN: ${PROJECT_IMPORT_7Z_BIN:-/usr/bin/7z}
      # Platform
      ENABLE_SIMULATION_MODE: ${ENABLE_SIMULATION_MODE:-true}
    ports:
      - "8080:8080"
    volumes:
      - codevia-data:/app/data
      # ⚠️ SECURITY WARNING — Docker socket mount (opt-in, commented out).
      # Mounting /var/run/docker.sock gives this container root-equivalent
      # control over the HOST: project code already runs only inside the
      # sandbox, but anyone who compromises CodeVia (or the API) could start a
      # privileged container and escape. Enable it only on a dedicated,
      # single-tenant host, never with untrusted multi-user accounts. Prefer a
      # rootless daemon or an isolated sidecar (see the commented service below)
      # plus `PROJECT_SANDBOX_IMAGE_PULL=missing` if you cannot pre-pull images.
      # - /var/run/docker.sock:/var/run/docker.sock
      # When using a sidecar instead of the host socket, point the CLI at it:
      # DOCKER_HOST: tcp://docker:2375
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # OPTIONAL sidecar daemon for the sandbox (commented out by default).
  # Instead of handing the host socket to the app, run a separate Docker daemon
  # and let the CLI talk to it. Still privileged (a daemon is root-equivalent),
  # but blast radius and image cache are isolated from the host daemon.
  # Set `DOCKER_HOST: tcp://docker:2375` on codevia-web and build the image with
  # `--build-arg INSTALL_DOCKER_CLI=true`.
  # ---------------------------------------------------------------------------
  # docker:
  #   image: docker:27-dind
  #   container_name: codevia-docker
  #   privileged: true
  #   environment:
  #     # No TLS here: the socket is only reachable inside the compose network.
  #     DOCKER_TLS_CERTDIR: ""
  #   command: ["--host=tcp://0.0.0.0:2375"]
  #   volumes:
  #     - docker-data:/var/lib/docker
  #   restart: unless-stopped

volumes:
  codevia-data:
  # docker-data:
