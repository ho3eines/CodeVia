<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeVia — AI Engineering Agent Platform</title>
  <meta name="description" content="Multi-project, GitHub-centric, multi-agent, multi-model, Telegram-controlled AI engineering platform." />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css?v=DEV" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("cv-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        var d = localStorage.getItem("cv-dir") || "ltr";
        document.documentElement.setAttribute("dir", d);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Animated aurora light field -->
  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

  <div id="app">
    <button class="sidebar-scrim" id="sidebar-scrim" hidden aria-label="Close menu"></button>
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">×</button>
      <div class="brand">
        <div class="brand-logo">C</div>
        <div class="brand-text">
          <strong>CodeVia</strong>
          <span>AI Engineering Org</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="theme-switch" role="group" aria-label="Color theme">
          <span class="theme-thumb" id="theme-thumb"></span>
          <button class="theme-opt" data-theme-set="light" title="Light mode">☀️<span>Light</span></button>
          <button class="theme-opt" data-theme-set="dark" title="Dark mode">🌙<span>Dark</span></button>
        </div>
        <button class="btn btn-ghost" id="dir-toggle" title="Switch text direction (LTR / RTL)">⇄ Direction</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="icon-btn bell-btn" id="bell-btn" title="Notifications & approvals">🔔<span class="bell-count" id="bell-count" hidden></span></button>
          <button class="cmd-btn" id="cmd-palette-btn" title="Command Palette (Ctrl+K)">
            <span class="kbd">Ctrl</span><span class="kbd">K</span> Search
          </button>
          <span class="pill pill-live" id="live-pill" title="Realtime connected"><span class="dot"></span><span class="pill-label" id="live-label">Live</span></span>
          <span id="user-slot"></span>
        </div>
      </header>

      <section class="content" id="content">
        <div class="skeleton-page" id="loading">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w90"></div>
          <div class="skeleton-card-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toasts"></div>

  <!-- Command Palette -->
  <div class="modal-backdrop" id="palette-backdrop" hidden>
    <div class="palette" id="palette">
      <input id="palette-input" placeholder="Type a command or search…" autocomplete="off" />
      <ul class="palette-list" id="palette-list"></ul>
      <div class="palette-hint">↑↓ navigate · Enter select · Esc close</div>
    </div>
  </div>

  <!-- Generic modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Test verdict dialog. Its own layer so it can stack above an open form
       modal (e.g. the model editor) without destroying the form's state. -->
  <div class="modal-backdrop verdict-backdrop" id="verdict-backdrop" hidden>
    <div class="modal verdict-modal" id="verdict-modal">
      <div class="modal-head">
        <h3 id="verdict-title"></h3>
        <button class="icon-btn" id="verdict-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="verdict-body"></div>
    </div>
  </div>

  <!-- Streaming model chat modal -->
  <div class="modal-backdrop" id="chat-modal-backdrop" hidden>
    <div class="modal chat-modal" id="chat-modal">
      <div class="modal-head">
        <div>
          <h3 id="chat-modal-title"></h3>
          <div class="mono" id="chat-modal-sub" style="font-size:11px;color:var(--text-muted)"></div>
        </div>
        <button class="icon-btn" id="chat-modal-close">×</button>
      </div>
      <div class="modal-body" id="chat-modal-body"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=DEV"></script>
  <script>
    // Register the PWA service worker. Fail quietly on non-HTTPS / localhost
    // mismatches (localhost is treated as secure by modern browsers).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () { /* noop */ });
      });
    }
  </script>
</body>
</html>
